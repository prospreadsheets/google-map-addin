<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
    <link rel="stylesheet" href="taskpane.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <script src="html2canvas.min.js"></script>
</head>
<body>
    <div id="toolbar">
        <button id="btnLoadMap" onclick="loadMap()" disabled>Load Map</button>
        <button id="btnCapture" onclick="captureMap()" disabled>Capture</button>
        <button id="btnReset" onclick="resetView()" disabled>Reset View</button>
    </div>
    <div id="statusBar">
        <span id="status">Initialising...</span>
    </div>
    <div id="map"></div>
    <script src="taskpane.js"></script>
</body>
</html>
